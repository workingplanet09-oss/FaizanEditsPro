# Local development:   docker compose up -d db          (then `npm run dev` on your machine)
# Full stack:          docker compose --profile app up -d --build
#
# Copy .env.example to .env first and change AUTH_SECRET / CRON_SECRET. Values below override what the containers read.
name: faizaneditspro

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-faizan}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-faizan_dev}
      POSTGRES_DB: ${POSTGRES_DB:-faizaneditspro}
    ports:
      - "127.0.0.1:5432:5432" # bound to localhost only
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-faizan} -d $${POSTGRES_DB:-faizaneditspro}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    profiles: ["app"]
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: [.env]
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-faizan}:${POSTGRES_PASSWORD:-faizan_dev}@db:5432/${POSTGRES_DB:-faizaneditspro}
      JOBS_INLINE: "false" # the worker service runs background jobs
    ports:
      - "3000:3000"
    volumes:
      - storage:/app/.storage
    # Apply migrations and the idempotent bootstrap (roles, settings, forms, content defaults) on every start.
    command: ["sh", "-c", "npx prisma migrate deploy && npx tsx scripts/seed.ts && npm start"]

  worker:
    profiles: ["app"]
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: [.env]
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-faizan}:${POSTGRES_PASSWORD:-faizan_dev}@db:5432/${POSTGRES_DB:-faizaneditspro}
    volumes:
      - storage:/app/.storage
    command: ["npm", "run", "worker"]

volumes:
  pgdata:
  storage:
